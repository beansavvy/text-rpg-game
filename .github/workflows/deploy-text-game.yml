name: Deploy Text Game

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-text-game
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout text game
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Checkout GitHub Pages repository
        uses: actions/checkout@v7
        with:
          repository: beansavvy/beansavvy.github.io
          ref: main
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: github-pages

      - name: Replace text-game deployment
        run: |
          rm -rf github-pages/text-game
          mkdir -p github-pages/text-game
          cp -R out/. github-pages/text-game/

          touch github-pages/.nojekyll

      - name: Commit deployment
        working-directory: github-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add text-game .nojekyll

          if [ -z "$(git status --porcelain)" ]; then
            echo "No deployment changes to commit."
            exit 0
          fi

          git commit -m "Deploy text-game from ${GITHUB_SHA::7}"
          git push origin main